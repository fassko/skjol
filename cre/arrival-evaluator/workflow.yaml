# Targets:
#   replay-settings  -> app replay source (synthetic/recorded, labelled), demo clock allowed
#   staging-settings -> live Digitraffic / VesselFinder, simulation (MockKeystoneForwarder on Arc Testnet)
#   production-settings -> live Digitraffic / VesselFinder, for a deployed workflow (KeystoneForwarder)
# Live targets read the VesselFinder key from ../secrets.yaml (needed only for Indian ports).
replay-settings:
  user-workflow:
    workflow-name: "skjol-arrival-replay"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.replay.json"
    secrets-path: ""
staging-settings:
  user-workflow:
    workflow-name: "skjol-arrival-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.live.json"
    secrets-path: "../secrets.yaml"
production-settings:
  user-workflow:
    workflow-name: "skjol-arrival"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.live.json"
    secrets-path: "../secrets.yaml"
