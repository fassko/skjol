# Logical secret IDs used by the workflow. Simulation reads the values from the env vars named
# here (cre/.env or the shell); a deployed workflow reads them from the Vault DON.
secretsNames:
  # VesselFinder PortCalls key, needed only for live evaluation of Indian ports.
  VESSELFINDER_API_KEY:
    - VESSELFINDER_API_KEY_VAR
